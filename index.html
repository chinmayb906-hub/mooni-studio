<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mooni Story Studio</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0b1530;color:#f5efe0;padding:16px}
  .wrap{max-width:640px;margin:auto}
  h1{color:#ffd978;margin:0 0 4px}
  .sub{margin:0 0 16px;opacity:.8}
  label{display:block;margin:12px 0 4px;font-weight:600}
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #3a4a7a;background:#14204a;color:#fff;font-size:16px;box-sizing:border-box}
  button{margin-top:16px;padding:12px 16px;border:0;border-radius:8px;background:#ffd978;color:#0b1530;font-weight:700;font-size:16px;cursor:pointer}
  .card{background:#14204a;border-radius:12px;padding:12px;margin-top:14px}
  .card h3{margin:0 0 6px;color:#ffd978;font-size:16px}
  .card pre{white-space:pre-wrap;margin:0 0 8px;font-family:inherit;font-size:14px}
  .small{padding:6px 10px;font-size:13px;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌙 Mooni Story Studio</h1>
  <p class="sub">Scene prompts, caption and hashtags for a new Mooni episode.</p>

  <label for="place">Where does the story happen?</label>
  <select id="place">
    <option>a rainy street</option>
    <option>a crowded train</option>
    <option>a night market</option>
    <option>a birthday party</option>
    <option>a school bag</option>
    <option>a quiet park</option>
  </select>

  <label for="goal">What does Mooni help with?</label>
  <input id="goal" placeholder="e.g. helps a lost kitten find home">

  <label for="mood">Mood</label>
  <select id="mood">
    <option>cozy</option>
    <option>funny</option>
    <option>magical</option>
    <option>emotional</option>
  </select>

  <button id="go">Generate episode</button>
  <div id="out"></div>
</div>

<script>
const CHAR = "Mooni, a tiny glowing crescent-moon creature the size of an apple, soft cream body with a gentle gold glow, large round dark eyes, small star-shaped tail that glows brighter when happy and dims when sad, no outlines, smooth 3D cartoon style, warm night-blue lighting, cute and expressive";

function fallback(text, done) {
  const t = document.createElement("textarea");
  t.value = text;
  document.body.appendChild(t);
  t.select();
  document.execCommand("copy");
  t.remove();
  done();
}

function copy(text, btn) {
  const done = () => {
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = "Copy"), 1200);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  } else {
    fallback(text, done);
  }
}

function addCard(parent, title, text) {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h3");
  h.textContent = title;
  const pre = document.createElement("pre");
  pre.textContent = text;
  const btn = document.createElement("button");
  btn.className = "small";
  btn.textContent = "Copy";
  btn.onclick = () => copy(text, btn);
  card.append(h, pre, btn);
  parent.appendChild(card);
}

document.getElementById("go").onclick = () => {
  const place = document.getElementById("place").value;
  const goal = document.getElementById("goal").value.trim() || "helps someone who needs a little light";
  const mood = document.getElementById("mood").value;
  const out = document.getElementById("out");
  out.innerHTML = "";

  const scenes = [
    ["Scene 1: Opening", `Mooni wakes up inside a jacket pocket, ${place} visible outside the pocket opening, ${mood} mood`],
    ["Scene 2: Discovery", `Mooni peeks out and notices something in ${place}: she ${goal}`],
    ["Scene 3: Attempt", `Mooni tries to help but it goes slightly wrong, clumsy cute moment, star tail flickers`],
    ["Scene 4: Magic", `Mooni uses a tiny bit of moon magic, her glow grows bright, she ${goal}`],
    ["Scene 5: Ending", `Warm closing moment, Mooni snuggles back into the pocket, glow softly dims, final frame matches the opening frame so the video loops`]
  ];

  scenes.forEach(([title, desc]) => {
    addCard(out, title, `${CHAR}. Scene: ${desc}. Vertical 9:16, 6-8 seconds.`);
  });

  addCard(out, "Caption", `Mooni in ${place} 🌙✨ A tiny moon who ${goal}. Follow for more tiny moon adventures!`);
  addCard(out, "Hashtags", "#mooni #cartoon #cutecartoon #shorts #reels #animation #bedtimestory #moon");
};
</script>
</body>
</html>
