/* ---------- helpers ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function star(x, y, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}
function wrap(text, maxW) {
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  words.forEach(w => {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
}

/* ---------- Mooni sprite ---------- */
const sp = document.createElement("canvas");
sp.width = sp.height = 120;
(function () {
  const c = sp.getContext("2d");
  c.fillStyle = "#fff1cf";
  c.beginPath(); c.arc(60, 60, 50, 0, Math.PI * 2); c.fill();
  c.globalCompositeOperation = "destination-out";
  c.beginPath(); c.arc(82, 48, 44, 0, Math.PI * 2); c.fill();
  c.globalCompositeOperation = "source-over";
  c.fillStyle = "#2a2140"; c.beginPath(); c.arc(25, 62, 5, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#fff"; c.beginPath(); c.arc(26.5, 60, 1.6, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(255,150,150,0.6)"; c.beginPath(); c.arc(24, 76, 4, 0, Math.PI * 2); c.fill();
})();

function mooni(x, y, size, glow, t) {
  ctx.save();
  ctx.shadowColor = "#ffd978";
  ctx.shadowBlur = glow ? 45 + 12 * Math.sin(t * 4) : 14;
  ctx.drawImage(sp, x - size / 2, y - size / 2, size, size);
  ctx.restore();
  star(x + size * 0.32, y + size * 0.34, size * 0.11 * (1 + 0.2 * Math.sin(t * 5)), glow ? "#ffd24d" : "#d9bf6a");
}

/* ---------- characters ---------- */
function person(x, k, col, t, ph) {
  const s = k === "kid" ? 0.8 : k === "elder" ? 0.95 : 1.1;
  const bob = Math.sin(t * 3 + ph) * 2;
  ctx.save();
  ctx.translate(x, 470 + bob * 0.5);
  ctx.fillStyle = "#3b3b4f";
  ctx.fillRect(-12 * s, -18 * s, 9 * s, 18 * s);
  ctx.fillRect(3 * s, -18 * s, 9 * s, 18 * s);
  ctx.fillStyle = col;
  rr(-20 * s, -82 * s, 40 * s, 68 * s, 12 * s); ctx.fill();
  ctx.fillStyle = "#f2c9a0";
  circle(0, -98 * s, 17 * s);
  ctx.fillStyle = k === "elder" ? "#dcdcdc" : "#2a1b12";
  ctx.beginPath(); ctx.arc(0, -102 * s, 17 * s, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  circle(-6 * s, -98 * s, 2 * s); circle(6 * s, -98 * s, 2 * s);
  ctx.strokeStyle = "#a0522d"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -93 * s, 6 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}
function cat(x, col, t, ph) {
  const bob = Math.sin(t * 4 + ph) * 1.5;
  ctx.save();
  ctx.translate(x, 470 + bob);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, -16, 22, 14, 0, 0, Math.PI * 2); ctx.fill();
  circle(20, -30, 12);
  ctx.beginPath(); ctx.moveTo(12, -39); ctx.lineTo(15, -52); ctx.lineTo(21, -40); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22, -40); ctx.lineTo(28, -52); ctx.lineTo(30, -38); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-20, -18); ctx.quadraticCurveTo(-38, -30 + Math.sin(t * 5) * 6, -30, -44); ctx.stroke();
  ctx.fillStyle = "#222"; circle(17, -31, 1.8); circle(24, -31, 1.8);
  ctx.restore();
}
function label(x, txt) {
  ctx.font = 'bold 12px system-ui,"Noto Sans Devanagari",sans-serif';
  ctx.textAlign = "center";
  const w = ctx.measureText(txt).width + 14;
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  rr(x - w / 2, 478, w, 18, 9); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillText(txt, x, 491);
}

/* ---------- backgrounds ---------- */
const BG = {
  home: {a: "#ffd9a8", b: "#fff1d6", g: "#c9a36b"},
  street: {a: "#8fd3f4", b: "#e3f4ff", g: "#8e8e9a"},
  rain: {a: "#2e3a57", b: "#5a6a8c", g: "#3b4256"},
  station: {a: "#a5b4d6", b: "#e4eaf7", g: "#7d8396"},
  night: {a: "#0b1530", b: "#22386f", g: "#232a3d"},
  party: {a: "#2b1b4a", b: "#5a3b86", g: "#6b4a3a"}
};
function drawBg(s, t) {
  const c = BG[s.bg];
  const gr = ctx.createLinearGradient(0, 0, 0, 470);
  gr.addColorStop(0, c.a); gr.addColorStop(1, c.b);
  ctx.fillStyle = gr; ctx.fillRect(-20, -20, 400, 490);
  ctx.fillStyle = c.g; ctx.fillRect(-20, 470, 400, 200);

  if (s.bg === "home") {
    ctx.fillStyle = "#ffe08a"; circle(300, 70, 28);
    ctx.fillStyle = "#f3c9a0"; ctx.fillRect(20, 170, 320, 300);
    ctx.fillStyle = "#d98b5f";
    ctx.beginPath(); ctx.moveTo(0, 170); ctx.lineTo(180, 90); ctx.lineTo(360, 170); ctx.fill();
    ctx.fillStyle = "#bfe3ff"; ctx.fillRect(45, 230, 70, 70); ctx.fillRect(245, 230, 70, 70);
    ctx.fillStyle = "#8a5a3c"; ctx.fillRect(150, 330, 60, 140);
  } else if (s.bg === "street") {
    ctx.fillStyle = "#d9c7b2"; ctx.fillRect(-20, 230, 400, 240);
    ctx.fillStyle = "#9ec9e8";
    for (let i = 0; i < 3; i++) ctx.fillRect(25 + i * 115, 260, 70, 80);
    ctx.fillStyle = "#6a6a74"; ctx.fillRect(250, 476, 70, 8);
    ctx.fillStyle = "#6fa35a";
    ctx.beginPath(); ctx.ellipse(290, 474, 10, 5, 0.4, 0, Math.PI * 2); ctx.fill();
    if (s.shine) star(270, 472, 7 + 2 * Math.sin(t * 6), "#fff6b0");
  } else if (s.bg === "rain") {
    ctx.fillStyle = "#3d4663"; ctx.fillRect(-20, 260, 400, 210);
    ctx.fillStyle = "#8a5a3c"; ctx.fillRect(235, 410, 110, 36);
    ctx.fillStyle = "#222"; circle(255, 452, 12); circle(325, 452, 12);
    ctx.fillStyle = "#5b3d28"; ctx.fillRect(285, 340, 6, 70);
    const on = !s.dim;
    ctx.fillStyle = on ? "#ffd24d" : "#4a4a4a"; circle(288, 334, 12);
    if (on) {
      const lg = ctx.createRadialGradient(288, 334, 4, 288, 334, 110);
      lg.addColorStop(0, "rgba(255,210,77,0.45)"); lg.addColorStop(1, "rgba(255,210,77,0)");
      ctx.fillStyle = lg; ctx.fillRect(150, 230, 280, 230);
    }
  } else if (s.bg === "station") {
    ctx.fillStyle = "#6b7186"; ctx.fillRect(50, 150, 30, 320); ctx.fillRect(280, 150, 30, 320);
    ctx.fillStyle = "#2d4a8a"; rr(115, 160, 130, 36, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("STATION", 180, 184);
    ctx.fillStyle = "#f2c94c"; ctx.fillRect(-20, 466, 400, 6);
  } else if (s.bg === "night") {
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 30; i++) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + i);
      ctx.fillRect((i * 83) % 360, (i * 47) % 200, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#3a4560"; ctx.fillRect(10, 250, 210, 220);
    ctx.strokeStyle = "#2b3550"; ctx.lineWidth = 3;
    for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.moveTo(10, 262 + i * 21); ctx.lineTo(220, 262 + i * 21); ctx.stroke(); }
    ctx.fillStyle = "#6b4a2a"; ctx.fillRect(240, 430, 50, 40);
  } else if (s.bg === "party") {
    const cols = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff"];
    for (let i = 0; i < 9; i++) {
      ctx.fillStyle = cols[i % 4];
      ctx.beginPath(); ctx.moveTo(i * 45, 110); ctx.lineTo(i * 45 + 45, 110); ctx.lineTo(i * 45 + 22, 150); ctx.fill();
    }
    ctx.fillStyle = "#8a5a3c"; ctx.fillRect(120, 430, 120, 40);
    ctx.fillStyle = "#fff1f1"; ctx.fillRect(150, 405, 60, 26);
    ctx.fillStyle = "#ff9eb5"; ctx.fillRect(150, 405, 60, 8);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = "#fff"; ctx.fillRect(163 + i * 14, 392, 4, 13);
      if (s.glow || s.fl) { ctx.fillStyle = "#ffb84d"; circle(165 + i * 14, 388, 4 + Math.sin(t * 8 + i)); }
    }
  }
}

/* ---------- scene and cards ---------- */
const XS = {1: [150], 2: [110, 250], 3: [80, 180, 280], 4: [55, 140, 225, 310]};

function drawScene(ep, i, tt, t) {
  const s = ep.sc[i];
  ctx.save();
  const z = 1 + 0.04 * tt / SCENE;
  ctx.translate(180, 320); ctx.scale(z, z); ctx.translate(-180, -320);
  drawBg(s, t);
  const xs = XS[s.who.length];
  s.who.forEach((ci, k) => {
    const p = ep.cast[ci];
    if (p.k === "cat") cat(xs[k], p.c, t, k); else person(xs[k], p.k, p.c, t, k);
    label(xs[k], p.n[L === 1 ? 1 : 0]);
  });
  if (s.bg === "rain") {
    ctx.strokeStyle = "rgba(200,220,255,0.55)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let j = 0; j < 70; j++) {
      const x = (j * 41) % 380 - 10, y = ((j * 67) + t * 420) % 700 - 30;
      ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14);
    }
    ctx.stroke();
  }
  if (s.dim) { ctx.fillStyle = "rgba(0,0,0,0.42)"; ctx.fillRect(-20, -20, 400, 700); }
  const mx = xs[0] + 32, my = 300 + Math.sin(t * 2) * 6;
  if (s.glow) {
    const lg = ctx.createRadialGradient(mx, my, 10, mx, my, 260);
    lg.addColorStop(0, "rgba(255,225,140,0.55)"); lg.addColorStop(1, "rgba(255,225,140,0)");
    ctx.fillStyle = lg; ctx.fillRect(-20, -20, 400, 700);
  }
  mooni(mx, my, s.glow ? 84 : 64, !!s.glow, t);
  ctx.restore();

  ctx.fillStyle = "rgba(8,14,36,0.6)"; rr(12, 12, 150, 28, 14); ctx.fill();
  ctx.fillStyle = "#ffd978"; ctx.font = "bold 13px system-ui,sans-serif"; ctx.textAlign = "left";
  ctx.fillText("🌙 Mooni · Ep " + (epI + 1), 24, 31);

  subtitle(s.l[L], tt);
}

function subtitle(text, tt) {
  ctx.font = 'bold 17px system-ui,"Noto Sans Devanagari",sans-serif';
  const lines = wrap(text, 296);
  const h = lines.length * 24 + 18, top = 622 - h;
  ctx.globalAlpha = Math.min(1, tt / 0.5);
  ctx.fillStyle = "rgba(8,14,36,0.8)"; rr(20, top, 320, h, 14); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center";
  lines.forEach((ln, k) => ctx.fillText(ln, 180, top + 26 + k * 24));
  ctx.globalAlpha = 1;
}

function cardBg(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 640);
  g.addColorStop(0, "#0b1530"); g.addColorStop(1, "#22386f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 360, 640);
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + i);
    ctx.fillRect((i * 83) % 360, (i * 131) % 520, 2, 2);
  }
  ctx.globalAlpha = 1;
}
function titleCard(ep, t) {
  cardBg(t);
  mooni(180, 250 + Math.sin(t * 2) * 8, 150, true, t);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd978"; ctx.font = "bold 22px system-ui,sans-serif";
  ctx.fillText("Episode " + (epI + 1), 180, 395);
  ctx.fillStyle = "#f5efe0"; ctx.font = 'bold 30px system-ui,"Noto Sans Devanagari",sans-serif';
  wrap(ep.t[L], 300).forEach((ln, k) => ctx.fillText(ln, 180, 442 + k * 38));
  ctx.fillStyle = "#9fb0e0"; ctx.font = "16px system-ui,sans-serif";
  ctx.fillText(LN[L], 180, 590);
}
function outroCard(t) {
  cardBg(t);
  mooni(180, 270, 130, true, t);
  ctx.textAlign = "center"; ctx.fillStyle = "#f5efe0";
  ctx.font = 'bold 22px system-ui,"Noto Sans Devanagari",sans-serif';
  wrap(OUTRO_TXT[L], 300).forEach((ln, k) => ctx.fillText(ln, 180, 410 + k * 32));
  ctx.fillStyle = "#ffd978"; ctx.font = "bold 18px system-ui,sans-serif";
  ctx.fillText("🌙 Mooni", 180, 520);
}

function total() { return INTRO + EPS[epI].sc.length * SCENE + OUTRO; }

function render(t) {
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.clearRect(0, 0, 360, 640);
  const ep = EPS[epI], n = ep.sc.length;
  if (t < INTRO) { titleCard(ep, t); return; }
  const u = t - INTRO;
  if (u >= n * SCENE) { outroCard(u - n * SCENE); return; }
  const i = Math.floor(u / SCENE);
  drawScene(ep, i, u - i * SCENE, t);
}

/* ---------- playback and recording ---------- */
function setBusy(b) {
  busy = b;
  $("ep").disabled = b; $("play").disabled = b; $("rec").disabled = b;
  document.querySelectorAll(".pill").forEach(p => (p.disabled = b));
}

function run(done) {
  cancelAnimationFrame(raf);
  const start = performance.now();
  const step = now => {
    const t = (now - start) / 1000;
    if (t >= total()) { render(total() - 0.01); done && done(); return; }
    render(t);
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function scheduleMusic(ac, dest, dur) {
  const master = ac.createGain();
  master.gain.value = 0.18;
  master.connect(dest);
  const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 783.99, 659.25, 587.33];
  const t0 = ac.currentTime + 0.1;
  for (let i = 0; i * 0.55 < dur; i++) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = scale[i % scale.length];
    const st = t0 + i * 0.55;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(1, st + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, st + 0.5);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + 0.55);
  }
}

$("play").onclick = () => {
  setBusy(true);
  $("status").textContent = "Playing...";
  run(() => { setBusy(false); $("status").textContent = "Done."; });
};

$("rec").onclick = () => {
  if (typeof MediaRecorder === "undefined" || !cv.captureStream) {
    $("status").textContent = "This browser cannot record video. Please use Chrome.";
    return;
  }
  $("result").innerHTML = "";
  const stream = cv.captureStream(30);
  let ac = null;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const dest = ac.createMediaStreamDestination();
    scheduleMusic(ac, dest, total());
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  } catch (e) { ac = null; }

  const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || "";
  let rec;
  try {
    rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 4000000} : undefined);
  } catch (e) {
    $("status").textContent = "Could not start recording on this device.";
    return;
  }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const type = rec.mimeType || mime || "video/webm";
    const blob = new Blob(chunks, {type});
    const url = URL.createObjectURL(blob);
    const ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
    const v = document.createElement("video");
    v.src = url; v.controls = true; v.playsInline = true;
    const a = document.createElement("a");
    a.href = url; a.download = "mooni-episode-" + (epI + 1) + "-" + ["en", "hi", "hinglish"][L] + "." + ext;
    a.className = "btn"; a.textContent = "⬇ Download video";
    $("result").append(v, a);
    $("status").textContent = "Your video is ready!";
    if (ac) ac.close();
    setBusy(false);
  };
  setBusy(true);
  $("status").textContent = "Recording... keep this tab open (about " + Math.round(total()) + " seconds).";
  rec.start();
  run(() => { setTimeout(() => { if (rec.state !== "inactive") rec.stop(); }, 300); });
};

/* ---------- story text, language, episodes ---------- */
function fallbackCopy(text, done) {
  const t = document.createElement("textarea");
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); } catch (e) {}
  t.remove(); done();
}
function copyText(text, btn, label) {
  const done = () => { btn.textContent = "Copied!"; setTimeout(() => (btn.textContent = label), 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}

function showStory() {
  const ep = EPS[epI], box = $("story");
  box.innerHTML = "";
  const head = document.createElement("div");
  head.className = "card";
  const h = document.createElement("h3");
  h.textContent = "Episode " + (epI + 1) + ": " + ep.t[L];
  const p = document.createElement("p");
  p.textContent = ep.cast.map(c => c.n[L === 1 ? 1 : 0]).join(", ");
  head.append(h, p);
  box.appendChild(head);
  ep.sc.forEach((s, i) => {
    const c = document.createElement("div");
    c.className = "card";
    const hh = document.createElement("h3");
    hh.textContent = "Scene " + (i + 1);
    const pp = document.createElement("p");
    pp.textContent = s.l[L];
    c.append(hh, pp);
    box.appendChild(c);
  });
}

function buildEpOptions() {
  const sel = $("ep");
  sel.innerHTML = "";
  EPS.forEach((e, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = "Episode " + (i + 1) + ": " + e.t[L];
    sel.appendChild(o);
  });
  sel.value = epI;
}

function refresh() {
  buildEpOptions();
  showStory();
  $("result").innerHTML = "";
  $("status").textContent = "";
  render(1.5);
}

LN.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "pill" + (i === 0 ? " active" : "");
  b.textContent = name;
  b.onclick = () => {
    if (busy) return;
    L = i;
    document.querySelectorAll(".pill").forEach((p, k) => p.classList.toggle("active", k === i));
    refresh();
  };
  $("pills").appendChild(b);
});

$("ep").onchange = () => { epI = parseInt($("ep").value, 10); refresh(); };

$("copyStory").onclick = e => {
  const ep = EPS[epI];
  const text = "Episode " + (epI + 1) + ": " + ep.t[L] + "\n\n" +
    ep.sc.map((s, i) => "Scene " + (i + 1) + ": " + s.l[L]).join("\n\n");
  copyText(text, e.target, "Copy story");
};
$("copyPrompts").onclick = e => {
  const ep = EPS[epI];
  const cast = ep.cast.map(c => c.n[0] + " (" + c.k + ")").join(", ");
  const text = ep.sc.map((s, i) =>
    "Scene " + (i + 1) + ": " + CHAR + ". Setting: " + BGNAME[s.bg] +
    ". People: " + cast + ". " + s.l[0] +
    (s.glow ? " Mooni glows brightly." : "") +
    " Vertical 9:16, 5 seconds, consistent character design."
  ).join("\n\n");
  copyText(text, e.target, "Copy AI prompts");
};

/* ---------- new daily episodes (made automatically by GitHub) ---------- */
const REPO = "chinmayb906-hub/mooni-studio";

function loadNew() {
  const box = $("newEps");
  fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=20")
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(list => {
      box.innerHTML = "";
      const eps = list.filter(r => (r.assets || []).some(a => /\.mp4$/i.test(a.name)));
      if (!eps.length) {
        box.textContent = "No daily episodes yet. They appear here after the first successful run.";
        return;
      }
      eps.forEach(r => {
        const asset = r.assets.find(a => /\.mp4$/i.test(a.name));
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h3");
        h.textContent = r.name || r.tag_name;
        const v = document.createElement("video");
        v.src = asset.browser_download_url;
        v.controls = true; v.playsInline = true; v.preload = "none";
        const a = document.createElement("a");
        a.href = asset.browser_download_url;
        a.className = "btn"; a.textContent = "⬇ Download";
        a.setAttribute("download", asset.name);
        card.append(h, v, a);
        box.appendChild(card);
      });
    })
    .catch(() => { box.textContent = "Could not load the daily episodes right now."; });
}

refresh();
loadNew();
</script>
