name: Mooni Studio Lip Sync Episode Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: mooni-episode
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Mooni Studio
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg, Blender and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            blender \
            xvfb \
            xauth \
            libegl1 \
            libgl1 \
            libgles2 \
            libglib2.0-0 \
            mesa-utils

      - name: Run offline pipeline tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify API keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || exit 1
          test -n "$PIXABAY_API_KEY" || exit 1
          echo "API keys configured."

      - name: Generate AI story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python studio.py

      - name: Download footage
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python pixabay.py

      - name: Generate voices and audio timing
        run: python render_video.py voice

      - name: Generate audio-driven 3D animation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p output/3dframes
          xvfb-run -a blender -b -t 2 \
            --python-exit-code 1 \
            --python blender_animation.py

          echo "Checking Blender PNG frames..."
          find output/3dframes -type f -name "frame_*.png" -print

          test -s output/3dframes/scene_01/frame_0001.png

      - name: Create final video
        run: python render_video.py final

      - name: Verify final video
        run: |
          test -s output/mooni_episode.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/mooni_episode.mp4

      - name: Save Mooni Studio output
        if: always()
        uses: actions/upload-ar
