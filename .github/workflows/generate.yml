
name: Mooni Studio Advanced Episode Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mooni-episode
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Mooni Studio
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender


      - name: Verify API keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing"
            exit 1
          fi

          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "PIXABAY_API_KEY is missing"
            exit 1
          fi

          echo "API keys are configured."

      - name: Generate AI story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python studio.py

      - name: Download footage
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python pixabay.py
        
      - name: Generate procedural 3D scenes
        run: |
          blender -b -t 2 --python blender_animation.py


      - name: Render vertical episode
        run: python render_video.py

      - name: Verify video
        run: |
          test -s output/mooni_episode.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/mooni_episode.mp4

      - name: Save Mooni Studio output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mooni-studio-episode
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/episode.json
            output/mooni_episode.mp4
            output/voice/
            output/clips/
            output/scenes/
