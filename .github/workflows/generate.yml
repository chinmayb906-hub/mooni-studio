name: Mooni Studio Episode Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
        
        - name: Install FFmpeg
          run: |
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            
      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python studio.py

      - name: Download video footage
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python pixabay.py

      - name: Render complete video
        run: python render_video.py

      - name: Save episode and video
        uses: actions/upload-artifact@v4
        with:
          name: mooni-studio-output
          path: |
            output/episode.json
            output/mooni_episode.mp4
            output/clips/
            output/voice/
